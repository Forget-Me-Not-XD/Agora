const AREA_COLORS = { backend:"#f7768e", web:"#7aa2f7", mobile:"#9ece6a", ml:"#e0af68", shared:"#bb9af7", external:"#6b7385" };
const DIM = "#20263a";
const groupByApp = document.getElementById("groupByApp");

const nodes = DATA.nodes.map(([label, community, area, file, loc, deg], id) => ({
  id, label, community, area: DATA.areas[area], file: DATA.files[file], loc, deg
}));
const links = DATA.links.map(([s, t, rel, inferred]) => ({ source: s, target: t, rel: DATA.relations[rel], inferred: !!inferred }));

const neighbors = nodes.map(() => new Map()); // id -> Map(neighborId -> [relations])
DATA.links.forEach(([s, t, rel]) => {
  const r = DATA.relations[rel];
  (neighbors[s].get(t) || neighbors[s].set(t, []).get(t)).push(r);
  (neighbors[t].get(s) || neighbors[t].set(s, []).get(s)).push(r);
});

const communityColor = c => c < 0 ? "#6b7385" : `hsl(${(c * 137.508) % 360}, 62%, 62%)`;

let colorMode = "area";
let selected = null;
const hidden = new Set();

const baseColor = n => colorMode === "area" ? (AREA_COLORS[n.area] || "#999") : communityColor(n.community);
const isNear = n => !selected || n.id === selected.id || neighbors[selected.id].has(n.id);
const endpointId = e => typeof e === "object" ? e.id : e;

document.getElementById("stats").textContent =
  `${nodes.length.toLocaleString()} nodes · ${links.length.toLocaleString()} links · commit ${DATA.commit}`;

const Graph = ForceGraph3D()(document.getElementById("graph"))
  .backgroundColor("#0b0e14")
  .graphData({ nodes, links })
  .nodeRelSize(3)
  .nodeVal(n => 1 + Math.sqrt(n.deg) * 1.6)
  .nodeResolution(10)
  .nodeLabel(n => `<b>${escapeHtml(n.label)}</b><br><span style="opacity:.7">${escapeHtml(n.file || n.area)}</span>`)
  .nodeColor(n => isNear(n) ? baseColor(n) : DIM)
  .nodeOpacity(0.92)
  .nodeVisibility(n => !hidden.has(n.area))
  .linkVisibility(l => {
    const s = nodes[endpointId(l.source)], t = nodes[endpointId(l.target)];
    return !hidden.has(s.area) && !hidden.has(t.area) && (showInferred.checked || !l.inferred);
  })
  .linkColor(l => isSelectedLink(l) ? "#ffffff" : (l.inferred ? "#e0af68" : "#5c6a8a"))
  .linkOpacity(0.22)
  .linkWidth(l => isSelectedLink(l) ? 1.2 : 0)
  .linkLabel(l => l.rel)
  .linkDirectionalParticles(l => particles.checked && isSelectedLink(l) ? 3 : 0)
  .linkDirectionalParticleWidth(1.6)
  .onNodeClick(focusNode)
  .onBackgroundClick(clearSelection)
  .warmupTicks(160)
  .cooldownTicks(120);

Graph.d3Force("charge").strength(-55);
Graph.d3Force("link").distance(30);

// Pull each app toward its own anchor so backend / web / mobile / ml separate in space.
const ANCHORS = { backend:[-260,0,0], web:[260,0,0], mobile:[0,260,-120], ml:[0,-260,-120], shared:[0,0,200], external:[0,0,0] };
function groupForce(alpha) {
  if (!groupByApp.checked) return;
  const k = 0.04 * alpha;
  for (const n of nodes) {
    const [ax, ay, az] = ANCHORS[n.area] || [0, 0, 0];
    n.vx += (ax - n.x) * k; n.vy += (ay - n.y) * k; n.vz += (az - n.z) * k;
  }
}
Graph.d3Force("group", groupForce);

function isSelectedLink(l) {
  return selected && (endpointId(l.source) === selected.id || endpointId(l.target) === selected.id);
}

function refresh() {
  Graph.nodeColor(Graph.nodeColor()).linkColor(Graph.linkColor())
       .linkWidth(Graph.linkWidth()).linkDirectionalParticles(Graph.linkDirectionalParticles());
}

function focusNode(n) {
  selected = n;
  refresh();
  const dist = 140;
  const r = Math.hypot(n.x || 1, n.y || 1, n.z || 1);
  const k = 1 + dist / r;
  Graph.cameraPosition({ x: n.x * k, y: n.y * k, z: n.z * k }, n, 1200);
  renderInfo(n);
}

function clearSelection() {
  selected = null;
  refresh();
  info.hidden = true;
}

const info = document.getElementById("info");
function renderInfo(n) {
  const near = [...neighbors[n.id].entries()]
    .map(([id, rels]) => ({ n: nodes[id], rels: [...new Set(rels)] }))
    .sort((a, b) => b.n.deg - a.n.deg);
  info.innerHTML = `
    <button class="close" title="Close">×</button>
    <h3>${escapeHtml(n.label)}</h3>
    <div class="file">${escapeHtml(n.file || "(external dependency)")}${n.loc ? ":" + escapeHtml(n.loc.replace(/^L/, "")) : ""}</div>
    <div class="sub" style="margin-top:6px">
      <span class="dot" style="display:inline-block;vertical-align:-1px;background:${AREA_COLORS[n.area]}"></span>
      ${escapeHtml(n.area)} · community ${n.community} · ${n.deg} links
    </div>
    <h2>Connected to (${near.length})</h2>
    ${near.map(({ n: m, rels }) => `
      <div class="row" data-id="${m.id}">
        <span class="dot" style="background:${baseColor(m)}"></span>
        <span class="n" title="${escapeHtml(m.file || "")}">${escapeHtml(m.label)}</span>
        <span class="rel">${escapeHtml(rels.join(", "))}</span>
      </div>`).join("")}`;
  info.hidden = false;
  info.querySelector(".close").onclick = clearSelection;
  info.querySelectorAll(".row").forEach(el => el.onclick = () => focusNode(nodes[+el.dataset.id]));
}

// Search
const search = document.getElementById("search");
const results = document.getElementById("results");
search.addEventListener("input", () => {
  const q = search.value.trim().toLowerCase();
  if (!q) { results.innerHTML = ""; return; }
  const hits = nodes
    .filter(n => n.label.toLowerCase().includes(q) || (n.file || "").toLowerCase().includes(q))
    .sort((a, b) => (b.label.toLowerCase().startsWith(q) - a.label.toLowerCase().startsWith(q)) || b.deg - a.deg)
    .slice(0, 12);
  results.innerHTML = hits.length ? hits.map(n => `
    <div class="row" data-id="${n.id}">
      <span class="dot" style="background:${baseColor(n)}"></span>
      <span class="n" title="${escapeHtml(n.file || "")}">${escapeHtml(n.label)}</span>
      <span class="c">${n.deg}</span>
    </div>`).join("") : `<div class="hint">No matches</div>`;
  results.querySelectorAll(".row").forEach(el => el.onclick = () => focusNode(nodes[+el.dataset.id]));
});
search.addEventListener("keydown", e => {
  if (e.key === "Enter") results.querySelector(".row")?.click();
  if (e.key === "Escape") { search.value = ""; results.innerHTML = ""; }
});

// Color mode
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  colorMode = b.dataset.mode;
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x === b));
  refresh();
  if (selected) renderInfo(selected);
});

// App filters
const areaCounts = {};
nodes.forEach(n => areaCounts[n.area] = (areaCounts[n.area] || 0) + 1);
const order = ["backend", "web", "mobile", "ml", "shared", "external"];
document.getElementById("areas").innerHTML = Object.keys(areaCounts)
  .sort((a, b) => order.indexOf(a) - order.indexOf(b))
  .map(a => `
    <label class="row">
      <input type="checkbox" data-area="${a}" checked>
      <span class="dot" style="background:${AREA_COLORS[a] || "#999"}"></span>
      <span class="n">${a}</span><span class="c">${areaCounts[a]}</span>
    </label>`).join("");
document.querySelectorAll("[data-area]").forEach(cb => cb.onchange = () => {
  cb.checked ? hidden.delete(cb.dataset.area) : hidden.add(cb.dataset.area);
  Graph.nodeVisibility(Graph.nodeVisibility()).linkVisibility(Graph.linkVisibility());
});

const showInferred = document.getElementById("showInferred");
const particles = document.getElementById("particles");
showInferred.onchange = () => Graph.linkVisibility(Graph.linkVisibility());
particles.onchange = refresh;
groupByApp.onchange = () => { Graph._fitted = false; Graph.d3ReheatSimulation(); };

document.getElementById("reset").onclick = () => { clearSelection(); Graph.zoomToFit(800, 40); };
document.getElementById("toggle").onclick = () => document.getElementById("controls").classList.toggle("collapsed");
document.addEventListener("keydown", e => { if (e.key === "Escape" && document.activeElement !== search) clearSelection(); });

Graph.onEngineStop(() => { if (!Graph._fitted) { Graph._fitted = true; Graph.zoomToFit(800, 40); } });
window.addEventListener("resize", () => Graph.width(innerWidth).height(innerHeight));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
}
</script>
