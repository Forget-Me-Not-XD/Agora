apiVersion: apps/v1
kind: Deployment
metadata:
  name: span4-web
  namespace: span4
spec:
  replicas: 2
  selector:
    matchLabels:
      app: span4-web
  template:
    metadata:
      labels:
        app: span4-web
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: span4-web
                topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/koek1/span4-web:v2
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            # Server-side only (Next's own Node process) — stays in-cluster,
            # never bounces back out through Cloudflare. Distinct from
            # NEXT_PUBLIC_API_URL, which is baked into the browser bundle
            # at image build time.
            - name: API_URL
              value: "http://span4-api:3000"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /login, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /login, port: 3001 }
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: span4-web
  namespace: span4
spec:
  selector:
    app: span4-web
  ports:
    - port: 3001
      targetPort: 3001
