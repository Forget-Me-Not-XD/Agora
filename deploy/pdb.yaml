apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: span4-api-pdb
  namespace: span4
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: span4-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: span4-web-pdb
  namespace: span4
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: span4-web
