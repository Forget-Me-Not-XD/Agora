apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-pvc
  namespace: span4
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: span4
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      nodeSelector:
        kubernetes.io/hostname: k3s-master
      containers:
        - name: redis
          image: redis:7.2-alpine
          # Redis has no idea about the container's memory limit, so tell it. Without this it
          # keeps filling until the kubelet kills the pod; with it, the keys closest to expiring
          # are dropped instead. Every throttler key has an expiry, so they are all candidates.
          args: ["redis-server", "--maxmemory", "200mb", "--maxmemory-policy", "volatile-ttl"]
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            # Room above maxmemory (200mb) for fragmentation and the fork during a background save
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: redis-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: span4
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
