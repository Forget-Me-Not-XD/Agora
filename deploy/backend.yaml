apiVersion: apps/v1
kind: Deployment
metadata:
  name: span4-api
  namespace: span4
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: span4-api
  template:
    metadata:
      labels:
        app: span4-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: span4-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/koek1/span4-backend:v3
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: span4-backend-secrets
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: span4-api
  namespace: span4
spec:
  selector:
    app: span4-api
  ports:
    - port: 3000
      targetPort: 3000
