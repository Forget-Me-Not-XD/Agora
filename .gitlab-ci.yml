stages:
  - quality
  - build

# These checks run on every merge request and on main. A type error or a failing test stops the
# pipeline, so on main the images below only get built from code that compiles. The lint jobs are
# allowed to fail for now, so they only warn.
.quality_template:
  stage: quality
  tags:
    - k3s-arm64
  # The same Node version the backend and web Dockerfiles use. Plain Node is enough for these
  # jobs, so they don't need the docker-in-docker setup the build jobs have.
  image: node:20-bookworm-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
  variables:
    # npm keeps its downloads inside the project folder, where the GitLab cache below can save
    # them between runs.
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  cache:
    key: npm-$APP
    paths:
      - .npm/
  before_script:
    - cd "apps/$APP"
    - npm ci --no-audit --no-fund --prefer-offline

backend-typecheck-test:
  extends: .quality_template
  variables:
    APP: backend
  script:
    - npx tsc --noEmit
    - npm test --if-present

web-typecheck-test:
  extends: .quality_template
  variables:
    APP: web
  script:
    - npx tsc --noEmit
    - npm test --if-present

mobile-typecheck:
  extends: .quality_template
  variables:
    APP: mobile
  script:
    - npx tsc --noEmit

backend-lint:
  extends: .quality_template
  allow_failure: true
  variables:
    APP: backend
  script:
    - npm run lint

web-lint:
  extends: .quality_template
  allow_failure: true
  variables:
    APP: web
    NEXT_TELEMETRY_DISABLED: "1"
  script:
    - npm run lint

.build_template:
  stage: build
  # Only the in-cluster k3s runner (kubernetes executor) may take these jobs: DOCKER_HOST below
  # relies on dind sharing the job's pod network, which a docker-executor runner doesn't do.
  tags:
    - k3s-arm64
  image: docker:27
  services:
    - name: docker:27-dind
      command: ["--mtu=1450"]
  variables:
    DOCKER_HOST: tcp://localhost:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  before_script:
    # Cross-arch build support (this repo targets arm64 Raspberry Pis; GitLab
    # shared runners are typically amd64) — same QEMU technique used locally.
    # TLS between build/dind is disabled: they're sibling containers in the
    # same pod talking over localhost, so it never leaves the pod's network
    # namespace — and it avoids a cert-generation race that reliably lost on
    # the Pi's slower CPUs (dind hadn't finished writing /certs/client yet).
    #
    # Kubernetes marks svc-0 "ready" as soon as the container starts, not
    # once dockerd is actually listening — on the Pi's CPU that startup can
    # take a few seconds, so wait for the daemon before using it.
    - |
      for i in $(seq 1 30); do
        docker info > /dev/null 2>&1 && break
        echo "Waiting for docker daemon..."
        sleep 2
      done
      docker info > /dev/null 2>&1 || (echo "Docker daemon never became available" && exit 1)
    - docker run --rm --privileged tonistiigi/binfmt --install arm64
    - docker buildx create --use
    - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin

build-backend:
  extends: .build_template
  script:
    - >
      docker buildx build --platform linux/arm64 -f apps/backend/Dockerfile
      -t ghcr.io/koek1/span4-backend:$CI_COMMIT_SHORT_SHA
      --push .
    - echo "Pushed ghcr.io/koek1/span4-backend:$CI_COMMIT_SHORT_SHA"

build-web:
  extends: .build_template
  script:
    - >
      docker buildx build --platform linux/arm64 -f apps/web/Dockerfile
      --build-arg NEXT_PUBLIC_API_URL=https://api.use-agora.com
      -t ghcr.io/koek1/span4-web:$CI_COMMIT_SHORT_SHA
      --push .
    - echo "Pushed ghcr.io/koek1/span4-web:$CI_COMMIT_SHORT_SHA"
