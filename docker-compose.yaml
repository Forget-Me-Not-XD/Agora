version: '3.9'

services:
  # ────────────────────────────────────────
  # MongoDB — primary database
  # ────────────────────────────────────────
  mongodb:
    image: mongo:7.0
    container_name: akademia-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - akademia-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # RabbitMQ — message broker
  # Management UI: http://localhost:15672
  # ────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: akademia-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "127.0.0.1:5672:5672"     # AMQP — localhost only
      - "127.0.0.1:15672:15672"   # Management UI — localhost only
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - akademia-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ────────────────────────────────────────
  # Redis — JWT blacklist + sessions
  # ────────────────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: akademia-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - akademia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
  rabbitmq_data:
  redis_data:

networks:
  akademia-net:
    driver: bridge